[package]
name = "andrea-conversation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Conversation orchestration (LLM + STT + TTS pipeline) for ANDREA."

[lib]
path = "src/lib.rs"

[dependencies]
andrea-llm = { path = "../andrea-llm" }
andrea-stt = { path = "../andrea-stt" }
andrea-tts = { path = "../andrea-tts" }
